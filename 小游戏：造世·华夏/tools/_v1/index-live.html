<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>造世·华夏</title>
<style>
  @font-face {
    font-family: 'FusionPixel';
    src: url('assets/fonts/fusion-pixel-12px-proportional.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: block;
  }

  :root {
    --bg: #0b0e13;
    --panel: #151a23;
    --panel-2: #1e2531;
    --panel-3: #262f3d;
    --line: #38414f;
    --line-strong: #5b6779;
    --ink: #ece5d3;
    --muted: #9c9684;
    --gold: #c8a86b;
    --gold-2: #e7cd8c;
    --cinnabar: #c05a4a;
    --jade: #6fae8c;
    --pop: #82c87e;
    --food: #dcb75c;
    --morale: #d07a63;
    --craft: #74aed0;
    --hidden: #9b86c4;
    --px: 'FusionPixel', 'Songti SC', monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--px);
    -webkit-font-smoothing: none; font-smooth: never;
    text-rendering: optimizeSpeed;
  }

  #app { position: fixed; inset: 0; }

  /* ---------- 舞台：固定 16:9，等比缩放居中 ---------- */
  .viewport { position: absolute; inset: 0; background: var(--bg); overflow: hidden; }
  .stage {
    position: absolute; top: 50%; left: 50%;
    width: 960px; height: 540px;
    transform-origin: center center;
    background: #0d1117;
    overflow: hidden;
    image-rendering: pixelated;
  }

  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

  .scene-canvas { position: absolute; inset: 0; width: 960px; height: 540px; }

  /* 像素框：双层硬边 */
  .pixel-box {
    background: var(--panel);
    border: 3px solid var(--line-strong);
    box-shadow: 0 0 0 3px var(--bg), inset 0 0 0 2px var(--line);
  }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; top: 0; left: 0; right: 0; height: 62px;
    display: flex; align-items: stretch; gap: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(11,14,19,.94), rgba(11,14,19,.78));
    border-bottom: 3px solid var(--line);
    padding: 6px 10px; z-index: 6;
  }
  .hud__id { display: flex; flex-direction: column; justify-content: center; min-width: 168px; padding-right: 12px; border-right: 2px solid var(--line); }
  .hud__act { font-size: 12px; color: var(--gold-2); letter-spacing: .04em; }
  .hud__turn { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .hud__land { font-size: 12px; color: var(--ink); margin-top: 3px; }

  .hud__stats { display: flex; gap: 10px; flex: 1; align-items: center; padding: 0 12px; }
  .gauge { flex: 1; min-width: 0; }
  .gauge__top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
  .gauge__label { color: var(--muted); }
  .gauge__value { color: var(--ink); }
  .gauge__bar { height: 8px; margin-top: 3px; background: #0c1016; border: 2px solid var(--line); position: relative; }
  .gauge__fill { position: absolute; inset: 0; width: 0; transition: width .5s steps(12, end); }
  .gauge--pop .gauge__fill { background: var(--pop); }
  .gauge--food .gauge__fill { background: var(--food); }
  .gauge--morale .gauge__fill { background: var(--morale); }
  .gauge--craft .gauge__fill { background: var(--craft); }
  .gauge__value.bump { animation: bump .5s steps(4, end); }
  @keyframes bump { 0% { transform: translateY(0); } 40% { transform: translateY(-3px); } 100% { transform: translateY(0); } }

  .hud__hidden { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding-left: 12px; border-left: 2px solid var(--line); min-width: 92px; }
  .hstat { display: flex; justify-content: space-between; font-size: 12px; gap: 8px; }
  .hstat__k { color: var(--hidden); }
  .hstat__v { color: var(--ink); }

  .hud__flags { position: absolute; top: 62px; left: 10px; display: flex; gap: 6px; z-index: 6; flex-wrap: wrap; max-width: 60%; pointer-events: none; }
  .flag-chip { font-size: 12px; padding: 2px 6px; background: rgba(21,26,35,.9); border: 2px solid var(--cinnabar); color: var(--morale); }

  /* 浮动增减 */
  .fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 9; }
  .float-delta {
    position: absolute; font-size: 12px; padding: 1px 5px;
    background: rgba(11,14,19,.85); border: 2px solid var(--line);
    animation: floatUp 1.4s steps(14, end) forwards;
  }
  .float-delta--plus { color: var(--jade); border-color: var(--jade); }
  .float-delta--minus { color: var(--cinnabar); border-color: var(--cinnabar); }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }

  /* ---------- 对话框 ---------- */
  .dialogue {
    position: absolute; left: 12px; right: 12px; bottom: 12px; height: 150px;
    z-index: 7; padding: 12px 16px 14px;
    background: rgba(17,22,30,.95);
    border: 3px solid var(--line-strong);
    box-shadow: 0 0 0 3px var(--bg), inset 0 0 0 2px var(--line);
    transform: translateY(0);
  }
  .dialogue.hidden { display: none; }
  .dialogue__speaker {
    position: absolute; top: -16px; left: 14px;
    font-size: 12px; padding: 3px 12px;
    background: var(--panel-3); border: 3px solid var(--line-strong);
    color: var(--gold-2); letter-spacing: .06em;
  }
  .dialogue__text { font-size: 18px; line-height: 1.7; margin-top: 8px; color: var(--ink); min-height: 62px; white-space: pre-wrap; }
  .dialogue__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .dialogue__next {
    position: absolute; right: 16px; bottom: 10px; font-size: 14px; color: var(--gold-2);
    animation: blink 1s steps(2, end) infinite;
  }
  .dialogue__next.hidden { display: none; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* ---------- 选项面板 ---------- */
  .choices {
    position: absolute; left: 12px; right: 12px; bottom: 172px; z-index: 8;
    display: flex; flex-direction: column; gap: 8px;
  }
  .choices.hidden { display: none; }
  .choices__row { display: flex; gap: 8px; }
  .choice {
    flex: 1; min-width: 0; text-align: left; cursor: pointer;
    background: rgba(21,26,35,.96); border: 3px solid var(--line);
    box-shadow: 0 0 0 2px var(--bg);
    padding: 8px 10px; color: var(--ink); font-family: var(--px);
    transition: transform .12s steps(3, end), border-color .12s steps(3, end), background .12s steps(3, end);
    animation: choiceIn .28s steps(6, end) backwards;
  }
  .choice:nth-child(2) { animation-delay: .06s; }
  .choice:nth-child(3) { animation-delay: .12s; }
  @keyframes choiceIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .choice:hover, .choice:focus-visible { border-color: var(--gold); background: var(--panel-2); transform: translateY(-3px); outline: none; }
  .choice:active { transform: translateY(0); }
  .choice--disabled { opacity: .4; cursor: not-allowed; }
  .choice--disabled:hover { transform: none; border-color: var(--line); background: rgba(21,26,35,.96); }
  .choice__head { display: flex; align-items: center; gap: 6px; }
  .choice__name { font-size: 15px; color: var(--gold-2); }
  .choice__sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .choice__effects { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .choice--wide { flex-basis: 100%; }

  .tag { font-size: 12px; padding: 1px 5px; border: 2px solid var(--line-strong); color: var(--ink); background: var(--panel-3); }
  .tag[data-tag="农"] { color: var(--food); border-color: var(--food); }
  .tag[data-tag="工"] { color: var(--craft); border-color: var(--craft); }
  .tag[data-tag="治水"] { color: #6fc8d0; border-color: #6fc8d0; }
  .tag[data-tag="礼"] { color: var(--hidden); border-color: var(--hidden); }
  .tag[data-tag="商"] { color: var(--gold-2); border-color: var(--gold); }
  .tag[data-tag="迁"] { color: var(--jade); border-color: var(--jade); }
  .badge-good { font-size: 12px; padding: 1px 5px; border: 2px solid var(--jade); color: var(--jade); background: rgba(111,174,140,.12); }
  .badge-lock { font-size: 12px; padding: 1px 5px; border: 2px solid var(--line); color: var(--muted); }

  .chip { font-size: 12px; padding: 1px 5px; border: 2px solid var(--line); background: #0e131b; color: var(--muted); }
  .chip--plus { color: var(--jade); border-color: rgba(111,174,140,.6); }
  .chip--minus { color: var(--cinnabar); border-color: rgba(192,90,74,.6); }
  .chip--hidden { color: var(--hidden); border-color: rgba(155,134,196,.5); }

  /* ---------- 勘察热点 ---------- */
  .hotspot {
    position: absolute; transform: translate(-50%,-50%);
    width: 40px; height: 40px; display: grid; place-items: center;
    background: rgba(11,14,19,.62); border: 3px solid var(--gold);
    color: var(--gold-2); font-family: var(--px); font-size: 18px;
    cursor: pointer; z-index: 5; border-radius: 0;
    animation: pulse 1.6s steps(8, end) infinite;
  }
  .hotspot:hover { background: rgba(200,168,107,.28); }
  .hotspot--found { border-color: var(--jade); color: var(--jade); animation: none; opacity: .8; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(200,168,107,.5); } 50% { box-shadow: 0 0 0 6px rgba(200,168,107,0); } }
  .scout-count { position: absolute; top: 70px; right: 12px; z-index: 6; font-size: 12px; padding: 3px 8px; background: rgba(11,14,19,.85); border: 2px solid var(--line); color: var(--gold-2); pointer-events: none; }

  /* ---------- 标题 / 结算 / 崩盘 全屏层 ---------- */
  .fullayer { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; }
  .fullayer__veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,14,19,.55), rgba(11,14,19,.86)); }
  .fullayer__inner { position: relative; z-index: 2; text-align: center; padding: 12px; max-width: 760px; }

  .title-logo { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .seal { width: 56px; height: 56px; display: grid; place-items: center; font-size: 34px; color: var(--ink); background: var(--cinnabar); border: 3px solid var(--gold); box-shadow: 0 0 0 3px var(--bg); }
  .title-logo h1 { font-size: 48px; margin: 0; letter-spacing: .12em; color: var(--gold-2); font-weight: normal; }
  .title-kicker { font-size: 12px; letter-spacing: .3em; color: var(--muted); margin-bottom: 16px; }
  .title-sub { font-size: 18px; color: var(--ink); margin: 16px 0 4px; }
  .title-rule { width: 240px; height: 3px; margin: 16px auto; background: var(--line-strong); box-shadow: 0 0 0 2px var(--bg); }
  .title-actions { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .title-foot { font-size: 12px; color: var(--muted); margin-top: 20px; line-height: 1.8; }

  .btn {
    font-family: var(--px); font-size: 15px; cursor: pointer; color: var(--ink);
    padding: 9px 20px; background: var(--panel-2); border: 3px solid var(--line-strong);
    box-shadow: 0 0 0 2px var(--bg); transition: transform .12s steps(3,end), border-color .12s steps(3,end);
  }
  .btn:hover { border-color: var(--gold); transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn--primary { background: var(--gold); color: #1a1408; border-color: var(--gold-2); }
  .btn--primary:hover { background: var(--gold-2); }
  .btn--ghost { background: transparent; }
  .btn--small { font-size: 12px; padding: 5px 12px; }

  /* 幕末结算 */
  .end-panel { width: 720px; max-width: 96%; padding: 16px 20px; text-align: left; }
  .actend__kicker { font-size: 12px; letter-spacing: .24em; color: var(--muted); }
  .actend__title { font-size: 28px; margin: 4px 0 6px; color: var(--gold-2); font-weight: normal; }
  .actend__lede { font-size: 15px; line-height: 1.6; margin: 0 0 10px; }
  .grade { display: flex; align-items: center; gap: 16px; padding: 10px; background: var(--panel-2); border: 3px solid var(--line); margin-bottom: 10px; }
  .grade__seal { width: 64px; height: 64px; flex: 0 0 auto; display: grid; place-items: center; font-size: 40px; color: var(--ink); background: var(--cinnabar); border: 3px solid var(--gold); animation: sealIn .5s steps(8,end); }
  @keyframes sealIn { from { transform: scale(2.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .grade__label { font-size: 12px; color: var(--muted); letter-spacing: .12em; }
  .grade__value { font-size: 15px; margin-top: 4px; line-height: 1.6; }
  .stars { margin-left: auto; font-size: 24px; color: var(--gold-2); letter-spacing: 2px; }
  .stars .dim { color: var(--line-strong); }
  .stars span { display: inline-block; animation: starIn .4s steps(6,end) backwards; }
  @keyframes starIn { from { transform: translateY(-8px) scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .end-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 10px; }
  .end-stat { background: var(--panel-2); border: 2px solid var(--line); padding: 6px; text-align: center; }
  .end-stat__label { font-size: 12px; color: var(--muted); }
  .end-stat__value { font-size: 22px; margin-top: 2px; }
  .route-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .historian { font-size: 13px; line-height: 1.6; color: var(--ink); padding: 8px 12px; background: rgba(192,90,74,.08); border-left: 3px solid var(--cinnabar); margin-bottom: 10px; }
  .m1-note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
  .panel-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  .ending-title { font-size: 34px; color: var(--cinnabar); margin: 8px 0; font-weight: normal; }
  .ending-kicker { font-size: 12px; letter-spacing: .24em; color: var(--muted); }
  .ending-quote { font-size: 18px; color: var(--gold-2); line-height: 1.7; }
  .ending-text { font-size: 14px; color: var(--ink); line-height: 1.8; }

  /* 淡入淡出转场 */

  .rotate-hint { position: absolute; inset: 0; z-index: 50; display: none; flex-direction: column; gap: 14px; align-items: center; justify-content: center; text-align: center; background: var(--bg); font-size: 15px; color: var(--gold-2); padding: 24px; line-height: 2; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="js/data/lands.js" defer></script>
<script src="js/data/cards.js" defer></script>
<script src="js/data/acts.js" defer></script>
<script src="js/data/endings.js" defer></script>
<script src="js/save.js" defer></script>
<script src="js/engine.js" defer></script>
<script src="js/ui.js" defer></script>
</body>
</html>
