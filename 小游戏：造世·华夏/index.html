<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>造世·华夏</title>
<style>
  @font-face {
    font-family: 'FusionPixel';
    src: url('assets/fonts/fusion-pixel-12px-proportional.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: block;
  }

  :root {
    --bg: #0b0e13;
    --panel: #151a23;
    --panel-2: #1e2531;
    --panel-3: #262f3d;
    --line: #38414f;
    --line-strong: #5b6779;
    --ink: #ece5d3;
    --muted: #9c9684;
    --gold: #c8a86b;
    --gold-2: #e7cd8c;
    --cinnabar: #c05a4a;
    --jade: #6fae8c;
    --pop: #82c87e;
    --food: #dcb75c;
    --morale: #d07a63;
    --craft: #74aed0;
    --hidden: #9b86c4;
    --water: #6fc8d0;
    --px: 'FusionPixel', 'Songti SC', monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--px);
    -webkit-font-smoothing: none; font-smooth: never;
    text-rendering: optimizeSpeed;
  }

  #app { position: fixed; inset: 0; }

  /* 滚动条走本作的视觉语言 */
  * { scrollbar-width: thin; scrollbar-color: var(--gold) #0c1016; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0c1016; border-left: 2px solid var(--line); }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border: 2px solid #0c1016; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
  ::-webkit-scrollbar-corner { background: #0c1016; }

  .viewport { position: absolute; inset: 0; background: var(--bg); overflow: hidden; }
  .stage {
    position: absolute; top: 50%; left: 50%;
    width: 960px; height: 540px;
    transform-origin: center center;
    background: #0d1117; overflow: hidden;
    image-rendering: pixelated;
  }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .scene-canvas { position: absolute; inset: 0; width: 960px; height: 540px; }

  .pixel-box {
    background: var(--panel); border: 3px solid var(--line-strong);
    box-shadow: 0 0 0 3px var(--bg), inset 0 0 0 2px var(--line);
  }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: stretch;
    background: linear-gradient(180deg, rgba(11,14,19,.96), rgba(11,14,19,.80));
    border-bottom: 3px solid var(--line);
    padding: 5px 8px; z-index: 6;
  }
  .hud__id { display: flex; flex-direction: column; justify-content: center; min-width: 176px; padding-right: 10px; border-right: 2px solid var(--line); }
  .hud__act { font-size: 12px; color: var(--gold-2); letter-spacing: .04em; }
  .hud__turn { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .hud__land { font-size: 12px; color: var(--ink); margin-top: 2px; }

  .hud__stats { display: flex; gap: 9px; flex: 1; align-items: center; padding: 0 10px; }
  .gauge { flex: 1; min-width: 0; }
  .gauge__top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
  .gauge__label { color: var(--muted); }
  .gauge__value { color: var(--ink); }
  .gauge__cap { color: var(--line-strong); }
  .gauge__bar { height: 8px; margin-top: 3px; background: #0c1016; border: 2px solid var(--line); position: relative; overflow: hidden; }
  .gauge__fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width .5s steps(12, end); }
  .gauge--pop .gauge__fill { background: var(--pop); }
  .gauge--food .gauge__fill { background: var(--food); }
  .gauge--morale .gauge__fill { background: var(--morale); }
  .gauge--craft .gauge__fill { background: var(--craft); }
  .gauge__fill.low { animation: lowPulse 1.1s steps(2,end) infinite; }
  @keyframes lowPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .gauge__value.bump { animation: bump .5s steps(4, end); }
  @keyframes bump { 0% { transform: translateY(0); } 40% { transform: translateY(-3px); } 100% { transform: translateY(0); } }

  .hud__tools { display: flex; align-items: center; gap: 5px; padding-left: 9px; border-left: 2px solid var(--line); }
  .icon-btn {
    width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer;
    background: var(--panel-2); border: 2px solid var(--line-strong); color: var(--gold-2);
    font-family: var(--px); font-size: 15px; padding: 0;
    transition: border-color .12s steps(3,end), background .12s steps(3,end);
  }
  .icon-btn:hover { border-color: var(--gold); background: var(--panel-3); }
  .icon-btn.off { color: var(--line-strong); border-color: var(--line); }
  .icon-btn.on { border-color: var(--jade); color: var(--jade); }

  .hud__flags { position: absolute; top: 60px; left: 8px; display: flex; gap: 5px; z-index: 6; flex-wrap: wrap; max-width: 62%; pointer-events: none; }
  .flag-chip { font-size: 12px; padding: 2px 6px; background: rgba(21,26,35,.92); border: 2px solid var(--cinnabar); color: var(--morale); }
  .flag-chip.good { border-color: var(--jade); color: var(--jade); }

  .sky-chip {
    position: absolute; top: 60px; right: 8px; z-index: 6; font-size: 12px;
    padding: 3px 8px; background: rgba(11,14,19,.86); border: 2px solid var(--line);
    color: var(--gold-2); pointer-events: none; letter-spacing: .06em;
  }

  .fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 9; }
  .float-delta {
    position: absolute; font-size: 13px; padding: 1px 5px;
    background: rgba(11,14,19,.88); border: 2px solid var(--line);
    animation: floatUp 1.5s steps(14, end) forwards;
  }
  .float-delta--plus { color: var(--jade); border-color: var(--jade); }
  .float-delta--minus { color: var(--cinnabar); border-color: var(--cinnabar); }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }

  /* ---------- 底部面板：对话与选卡共用同一块地方 ---------- */
  .dock { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 148px; z-index: 7; }
  .dock.hidden { display: none; }

  .dialogue {
    position: absolute; inset: 0; padding: 12px 16px 12px;
    background: rgba(17,22,30,.95); border: 3px solid var(--line-strong);
    box-shadow: 0 0 0 3px var(--bg), inset 0 0 0 2px var(--line);
    cursor: pointer;
  }
  .dialogue.hidden { display: none; }
  .dialogue__speaker {
    position: absolute; top: -15px; left: 14px;
    font-size: 12px; padding: 2px 12px;
    background: var(--panel-3); border: 3px solid var(--line-strong);
    color: var(--gold-2); letter-spacing: .06em;
  }
  .dialogue__text { font-size: 18px; line-height: 1.65; margin-top: 6px; color: var(--ink); white-space: pre-wrap; }
  .dialogue__text.small { font-size: 15px; line-height: 1.7; }
  .dialogue__meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .dialogue__next { position: absolute; right: 14px; bottom: 8px; font-size: 13px; color: var(--gold-2); animation: blink 1s steps(2, end) infinite; }
  .dialogue__next.hidden { display: none; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  .choices { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; }
  .choices.hidden { display: none; }
  .crisis-ribbon {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px; min-height: 30px;
    background: rgba(17,22,30,.95); border: 3px solid var(--cinnabar);
    box-shadow: 0 0 0 3px var(--bg);
  }
  .crisis-ribbon__k { font-size: 12px; color: var(--cinnabar); letter-spacing: .1em; white-space: nowrap; }
  .crisis-ribbon__t { font-size: 14px; color: var(--gold-2); white-space: nowrap; }
  .crisis-ribbon__h { font-size: 12px; color: var(--muted); line-height: 1.4; flex: 1; min-width: 0; }
  .crisis-ribbon__btn { flex: 0 0 auto; }

  .choices__row { display: flex; gap: 8px; flex: 1; min-height: 0; }
  .choice {
    flex: 1; min-width: 0; text-align: left; cursor: pointer; overflow: hidden;
    display: flex; flex-direction: column;
    background: rgba(21,26,35,.96); border: 3px solid var(--line);
    box-shadow: 0 0 0 2px var(--bg);
    padding: 6px 8px; color: var(--ink); font-family: var(--px);
    transition: transform .12s steps(3, end), border-color .12s steps(3, end), background .12s steps(3, end);
    animation: choiceIn .28s steps(6, end) backwards;
  }
  .choice:nth-child(2) { animation-delay: .06s; }
  .choice:nth-child(3) { animation-delay: .12s; }
  @keyframes choiceIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .choice:hover, .choice:focus-visible { border-color: var(--gold); background: var(--panel-2); transform: translateY(-3px); outline: none; }
  .choice:active { transform: translateY(0); }
  .choice--disabled { opacity: .45; cursor: not-allowed; }
  .choice--disabled:hover { transform: none; border-color: var(--line); background: rgba(21,26,35,.96); }
  .choice--picked { border-color: var(--gold-2); background: var(--panel-3); }
  .choice__head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 5px; flex: 0 0 auto; }
  .choice__name { font-size: 15px; color: var(--gold-2); }
  .choice__sub { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .choice__effects { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; flex: 0 0 auto; }

  .tag { font-size: 12px; padding: 1px 5px; border: 2px solid var(--line-strong); color: var(--ink); background: var(--panel-3); white-space: nowrap; }
  .tag[data-tag="农"] { color: var(--food); border-color: var(--food); }
  .tag[data-tag="工"] { color: var(--craft); border-color: var(--craft); }
  .tag[data-tag="治水"] { color: var(--water); border-color: var(--water); }
  .tag[data-tag="礼"] { color: var(--hidden); border-color: var(--hidden); }
  .tag[data-tag="商"] { color: var(--gold-2); border-color: var(--gold); }
  .tag[data-tag="战"] { color: var(--cinnabar); border-color: var(--cinnabar); }
  .tag[data-tag="祭"] { color: #b58ad0; border-color: #b58ad0; }
  .tag[data-tag="迁"] { color: var(--jade); border-color: var(--jade); }
  .badge-good { font-size: 11px; line-height: 1.5; padding: 0 4px; border: 1px solid var(--jade); color: var(--jade); background: rgba(111,174,140,.12); white-space: nowrap; }
  .badge-lock { font-size: 11px; line-height: 1.5; padding: 0 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge-build { font-size: 11px; line-height: 1.5; padding: 0 4px; border: 1px solid var(--gold); color: var(--gold-2); background: rgba(200,168,107,.12); white-space: nowrap; }

  .chip { font-size: 11px; line-height: 1.55; padding: 0 4px; border: 1px solid var(--line); background: #0e131b; color: var(--muted); white-space: nowrap; }
  .chip--plus { color: var(--jade); border-color: rgba(111,174,140,.6); }
  .chip--minus { color: var(--cinnabar); border-color: rgba(192,90,74,.6); }
  .chip--hidden { color: var(--hidden); border-color: rgba(155,134,196,.5); }

  /* ---------- 勘察热点 ---------- */
  .hotspot {
    position: absolute; transform: translate(-50%,-50%);
    width: 40px; height: 40px; display: grid; place-items: center;
    background: rgba(11,14,19,.62); border: 3px solid var(--gold);
    color: var(--gold-2); font-family: var(--px); font-size: 18px;
    cursor: pointer; z-index: 5; border-radius: 0;
    animation: pulse 1.6s steps(8, end) infinite;
  }
  .hotspot:hover { background: rgba(200,168,107,.28); }
  .hotspot--found { border-color: var(--jade); color: var(--jade); animation: none; opacity: .8; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(200,168,107,.5); } 50% { box-shadow: 0 0 0 6px rgba(200,168,107,0); } }
  .scout-count { position: absolute; top: 60px; right: 8px; z-index: 6; font-size: 12px; padding: 3px 8px; background: rgba(11,14,19,.85); border: 2px solid var(--line); color: var(--gold-2); pointer-events: none; }

  /* ---------- 全屏层 ---------- */
  .fullayer { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; }
  .fullayer.hidden { display: none; }
  .fullayer__veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,14,19,.62), rgba(11,14,19,.90)); }
  .fullayer__veil.deep { background: linear-gradient(180deg, rgba(11,14,19,.86), rgba(11,14,19,.96)); }
  .fullayer__inner {
    position: relative; z-index: 2; text-align: center; padding: 10px; max-width: 900px; max-height: 528px;
    overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) rgba(11,14,19,.75);
  }
  .fullayer__inner::-webkit-scrollbar { width: 10px; }
  .fullayer__inner::-webkit-scrollbar-track { background: rgba(11,14,19,.75); border-left: 2px solid var(--line); }
  .fullayer__inner::-webkit-scrollbar-thumb { background: var(--line-strong); border: 2px solid var(--bg); }
  .fullayer__inner::-webkit-scrollbar-thumb:hover { background: var(--gold); }
  /* 只有会滚动的长面板才需要这条底衬，短面板加一层深底会像一块空框 */
  .fullayer__inner .end-panel .panel-actions,
  .fullayer__inner .reveal .panel-actions,
  .fullayer__inner .gallery .panel-actions {
    position: sticky; bottom: -10px; z-index: 3; padding: 10px 0;
    background: linear-gradient(180deg, rgba(11,14,19,0), rgba(11,14,19,.97) 42%);
  }
  .fade-in { animation: fadeIn .4s steps(8,end); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .title-logo { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .seal { width: 56px; height: 56px; display: grid; place-items: center; font-size: 34px; color: var(--ink); background: var(--cinnabar); border: 3px solid var(--gold); box-shadow: 0 0 0 3px var(--bg); }
  .title-logo h1 { font-size: 48px; margin: 0; letter-spacing: .12em; color: var(--gold-2); font-weight: normal; }
  .title-kicker { font-size: 12px; letter-spacing: .3em; color: var(--muted); margin-bottom: 14px; }
  .title-sub { font-size: 17px; color: var(--ink); margin: 14px 0 4px; line-height: 1.7; }
  .title-rule { width: 240px; height: 3px; margin: 14px auto; background: var(--line-strong); box-shadow: 0 0 0 2px var(--bg); }
  .title-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .title-foot { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.8; }

  .btn {
    font-family: var(--px); font-size: 15px; cursor: pointer; color: var(--ink);
    padding: 8px 18px; background: var(--panel-2); border: 3px solid var(--line-strong);
    box-shadow: 0 0 0 2px var(--bg); transition: transform .12s steps(3,end), border-color .12s steps(3,end);
  }
  .btn:hover { border-color: var(--gold); transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn--primary { background: var(--gold); color: #1a1408; border-color: var(--gold-2); }
  .btn--primary:hover { background: var(--gold-2); }
  .btn--danger { border-color: var(--cinnabar); color: var(--morale); }
  .btn--ghost { background: transparent; }
  .btn--small { font-size: 12px; padding: 4px 10px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; border-color: var(--line); }

  /* 选地 */
  .land-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 860px; max-width: 100%; }
  .land-card {
    text-align: left; cursor: pointer; padding: 0; overflow: hidden;
    background: var(--panel); border: 3px solid var(--line); color: var(--ink); font-family: var(--px);
    transition: border-color .12s steps(3,end), transform .12s steps(3,end);
  }
  .land-card:hover, .land-card.sel { border-color: var(--gold); transform: translateY(-3px); }
  .land-card__img { height: 74px; background-size: cover; background-position: center 62%; border-bottom: 2px solid var(--line); image-rendering: pixelated; }
  .land-card__body { padding: 6px 8px 8px; }
  .land-card__code { font-size: 12px; color: var(--gold-2); letter-spacing: .1em; }
  .land-card__name { font-size: 14px; margin-top: 2px; }
  .land-card__env { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .land-card__long { font-size: 12px; color: var(--jade); margin-top: 4px; line-height: 1.4; }
  .land-detail { width: 860px; max-width: 100%; text-align: left; padding: 12px 16px; }
  .land-detail__head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .land-detail__title { font-size: 24px; color: var(--gold-2); }
  .land-detail__desc { font-size: 14px; line-height: 1.7; margin: 8px 0; }
  .bn-row { display: flex; gap: 8px; margin: 8px 0; }
  .bn { flex: 1; padding: 6px 8px; background: rgba(192,90,74,.10); border: 2px solid var(--cinnabar); }
  .bn__n { font-size: 13px; color: var(--morale); }
  .bn__d { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }

  /* 幕末 / 结局 */
  .end-panel { width: 780px; max-width: 100%; padding: 14px 18px; text-align: left; }
  .actend__kicker { font-size: 12px; letter-spacing: .24em; color: var(--muted); }
  .actend__title { font-size: 26px; margin: 4px 0 6px; color: var(--gold-2); font-weight: normal; }
  .actend__lede { font-size: 14px; line-height: 1.6; margin: 0 0 10px; }
  .grade { display: flex; align-items: center; gap: 14px; padding: 9px; background: var(--panel-2); border: 3px solid var(--line); margin-bottom: 9px; }
  .grade__seal { width: 58px; height: 58px; flex: 0 0 auto; display: grid; place-items: center; font-size: 36px; color: var(--ink); background: var(--cinnabar); border: 3px solid var(--gold); animation: sealIn .5s steps(8,end); }
  @keyframes sealIn { from { transform: scale(2.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .grade__label { font-size: 12px; color: var(--muted); letter-spacing: .12em; }
  .grade__value { font-size: 14px; margin-top: 4px; line-height: 1.6; }
  .stars { margin-left: auto; font-size: 22px; color: var(--gold-2); letter-spacing: 2px; white-space: nowrap; }
  .stars .dim { color: var(--line-strong); }
  .stars span { display: inline-block; animation: starIn .4s steps(6,end) backwards; }
  @keyframes starIn { from { transform: translateY(-8px) scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .end-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 9px; }
  .end-stat { background: var(--panel-2); border: 2px solid var(--line); padding: 5px; text-align: center; }
  .end-stat__label { font-size: 12px; color: var(--muted); }
  .end-stat__value { font-size: 21px; margin-top: 2px; }
  .route-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 9px; }
  .historian { font-size: 13px; line-height: 1.6; color: var(--ink); padding: 7px 11px; background: rgba(192,90,74,.08); border-left: 3px solid var(--cinnabar); margin-bottom: 9px; }
  .panel-actions { display: flex; gap: 9px; justify-content: flex-end; flex-wrap: wrap; }

  .ending-hero { height: 148px; background-size: cover; background-position: center; border: 3px solid var(--line-strong); box-shadow: 0 0 0 3px var(--bg); margin-bottom: 10px; image-rendering: pixelated; position: relative; }
  .ending-hero__tier { position: absolute; left: 0; top: 0; font-size: 12px; padding: 3px 10px; background: rgba(11,14,19,.86); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); color: var(--gold-2); letter-spacing: .16em; }
  .ending-title { font-size: 30px; color: var(--gold-2); margin: 4px 0; font-weight: normal; }
  .ending-title.bad { color: var(--cinnabar); }
  .ending-kicker { font-size: 12px; letter-spacing: .24em; color: var(--muted); }
  .ending-quote { font-size: 16px; color: var(--gold-2); line-height: 1.7; margin: 6px 0; }
  .ending-text { font-size: 14px; color: var(--ink); line-height: 1.85; }
  .callback { font-size: 12px; color: var(--jade); line-height: 1.6; margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--jade); background: rgba(111,174,140,.08); }
  .near-note { font-size: 12px; color: var(--gold); line-height: 1.6; margin-top: 8px; padding: 6px 10px; border: 2px dashed var(--gold); }

  /* 邦交 */
  .diplo { width: 880px; max-width: 100%; padding: 12px 16px; text-align: left; }
  .diplo__warn { font-size: 13px; line-height: 1.7; color: var(--morale); padding: 7px 11px; border: 2px solid var(--cinnabar); background: rgba(192,90,74,.10); margin: 8px 0; }
  .diplo__grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 10px 0; }
  .partner {
    text-align: left; cursor: pointer; padding: 7px 8px; font-family: var(--px); color: var(--ink);
    background: var(--panel-2); border: 3px solid var(--line); position: relative;
    transition: border-color .12s steps(3,end), transform .12s steps(3,end);
  }
  .partner:hover { border-color: var(--gold); transform: translateY(-2px); }
  .partner.sel { border-color: var(--jade); background: rgba(111,174,140,.12); }
  .partner.full { opacity: .45; }
  .partner__icon { width: 26px; height: 26px; display: grid; place-items: center; font-size: 16px; background: var(--panel-3); border: 2px solid var(--line-strong); color: var(--gold-2); }
  .partner__code { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .partner__name { font-size: 13px; color: var(--gold-2); margin-top: 2px; line-height: 1.35; }
  .partner__give { font-size: 12px; color: var(--jade); margin-top: 5px; line-height: 1.45; }
  .partner__pay { font-size: 12px; color: var(--morale); margin-top: 4px; line-height: 1.45; }
  .partner__rel { font-size: 12px; color: var(--gold); margin-top: 5px; line-height: 1.4; }
  .partner__goods { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
  .diplo__foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .coverage { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .cov { padding: 2px 7px; border: 2px solid var(--line); color: var(--muted); }
  .cov.ok { border-color: var(--jade); color: var(--jade); background: rgba(111,174,140,.10); }

  /* 终章揭晓 */
  .reveal { width: 840px; max-width: 100%; padding: 14px 18px; text-align: left; }
  .reveal__culture { font-size: 28px; color: var(--gold-2); margin: 6px 0; }
  .reveal__line { font-size: 15px; line-height: 1.8; color: var(--ink); }
  .relics { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .relic { font-size: 12px; padding: 3px 9px; border: 2px solid var(--gold); color: var(--gold-2); background: rgba(200,168,107,.10); }
  .reveal__partners { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 8px; }
  .rp { padding: 7px 9px; background: var(--panel-2); border: 2px solid var(--line); }
  .rp__c { font-size: 12px; color: var(--muted); }
  .rp__n { font-size: 14px; color: var(--gold-2); margin-top: 3px; line-height: 1.4; }
  .rp__p { font-size: 12px; color: var(--jade); margin-top: 4px; line-height: 1.4; }

  /* 图鉴 */
  .gallery { width: 880px; max-width: 100%; padding: 12px 16px; text-align: left; }
  .gallery__grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 7px; margin-top: 10px; }
  .gcard { padding: 7px 8px; background: var(--panel-2); border: 3px solid var(--line); min-height: 92px; }
  .gcard.got { border-color: var(--gold); }
  .gcard__tier { font-size: 12px; color: var(--muted); letter-spacing: .14em; }
  .gcard__t { font-size: 13px; margin-top: 4px; line-height: 1.4; color: var(--line-strong); }
  .gcard.got .gcard__t { color: var(--gold-2); }
  .gcard__n { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
  .gcard__lands { font-size: 12px; color: var(--jade); margin-top: 4px; letter-spacing: .1em; }

  /* 太史卜辞 */
  .oracle { width: 620px; max-width: 100%; padding: 14px 18px; text-align: left; }
  .oracle__row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 2px solid var(--line); }
  .oracle__k { font-size: 15px; color: var(--hidden); min-width: 52px; }
  .oracle__bar { flex: 1; height: 10px; background: #0c1016; border: 2px solid var(--line); position: relative; }
  .oracle__fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--hidden); }
  .oracle__word { font-size: 13px; color: var(--ink); min-width: 104px; text-align: right; }
  .oracle__hint { font-size: 13px; line-height: 1.8; color: var(--muted); margin-top: 10px; }

  .rotate-hint { position: absolute; inset: 0; z-index: 50; display: none; flex-direction: column; gap: 14px; align-items: center; justify-content: center; text-align: center; background: var(--bg); font-size: 15px; color: var(--gold-2); padding: 24px; line-height: 2; }

  .peek .hud, .peek .dock, .peek .hud__flags, .peek .sky-chip, .peek .hotspot, .peek .scout-count { opacity: 0; pointer-events: none; transition: opacity .25s steps(5,end); }
  .peek-exit { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
